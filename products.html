<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Producten – GameShop Enter</title>
  <meta name="description" content="Bekijk het volledige assortiment tweedehands games en consoles van GameShop Enter. Filter op categorie en zoek naar jouw favoriete titel.">
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="assets/css2">
  <link rel="stylesheet" href="styles.css">
  <script defer src="script.js"></script>
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <div class="brand-area">
          <a href="index.html" aria-label="Home"><img src="assets/images/logo.png" alt="GameShop Enter logo"></a>
        </div>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="products.html" class="active">Producten</a></li>
          <li><a href="inkoop.html">Inkoop</a></li>
          <li><a href="about.html">Over&nbsp;ons</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="cart.html">Winkelwagen</a></li>
        </ul>
        <button id="darkModeToggle" class="dark-toggle" aria-label="Schakel dark mode">🌙</button>
      </nav>
    </div>
  </header>

  <main class="container" style="padding: 3rem 0;">
    <h1>Producten</h1>
    <p>Kies uit onze zorgvuldig geselecteerde titels en consoles. Gebruik de zoekbalk om snel te vinden wat je zoekt.</p>
    <!-- Search form -->
    <form onsubmit="event.preventDefault(); filterProducts(document.getElementById('productSearch').value);" style="margin: 1.5rem 0;">
      <input type="search" id="productSearch" placeholder="Zoek producten…" aria-label="Zoek producten" style="padding: 0.5rem; width: 70%; max-width: 300px;">
      <button type="submit" class="btn" style="padding: 0.5rem 1rem;">Zoek</button>
    </form>
    <!-- Dynamic product grid generated from inventory.json -->
    <div id="inventoryList" class="product-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.5rem;"></div>
  </main>
  <footer>
    <div class="container">
      <p>&copy; 2025 GameShop Enter. Alle rechten voorbehouden.</p>
      <p><a href="about.html">Over ons</a> · <a href="contact.html">Contact</a> · <a href="inkoop.html">Inkoop</a></p>
    </div>
  </footer>
</body>
</html>
