<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Producten | GameShop Enter</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="main.js"></script>
</head>
<body>
  <!-- Navigatie -->
  <header>
    <nav class="nav">
      <div class="logo-wrapper">
        <img src="images/logo.png" alt="GameShop Enter" class="logo" onerror="this.style.display='none'">
        <span class="brand">GameShop Enter</span>
      </div>
      <ul class="menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Producten</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li>
          <a href="cart.html" class="btn-small">🛒 (<span id="cartCount">0</span>)</a>
        </li>
      </ul>
    </nav>
  </header>

  <!-- Productoverzicht -->
  <main>
    <h2>Onze producten</h2>
    <p class="intro">Blader door ons assortiment van consoles, games en accessoires.</p>

    <div class="search-filter">
      <input type="text" id="search" placeholder="Zoek een product...">
      <select id="category"></select>
    </div>
    <div id="chips" class="chips-container"></div>
    <div id="product-grid" class="grid"></div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 GameShop Enter — Alle rechten voorbehouden.</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.GSE && GSE.loadProducts) {
        GSE.loadProducts();
      }
    });
  </script>
</body>
</html>
