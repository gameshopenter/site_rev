<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Verloop van groen naar blauw voor de randen en sterren -->
    <linearGradient id="gradTCG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <!-- Achterste kaart: volledig gekleurd met gradient -->
  <rect x="18" y="22" width="52" height="60" rx="5" ry="5" fill="url(#gradTCG)" />
  <!-- Voorste kaart: witte vulling met gekleurde rand -->
  <rect x="30" y="14" width="52" height="60" rx="5" ry="5" fill="#ffffff" stroke="url(#gradTCG)" stroke-width="3" />
  <!-- Ster: decoratief element op de voorste kaart -->
  <polygon points="55,38 58,46 67,46 59,51 62,58 55,53 48,58 51,51 43,46 52,46" fill="url(#gradTCG)" />
</svg>