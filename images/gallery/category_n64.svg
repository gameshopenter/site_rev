<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gebruik hetzelfde groene‑blauwe verloop als het logo voor herkenbaarheid -->
    <linearGradient id="gradN64" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <!-- Basis van de console: een afgeronde rechthoek -->
  <rect x="15" y="35" width="70" height="35" rx="8" ry="8" fill="url(#gradN64)" />
  <!-- Cartridgegleuf bovenop -->
  <rect x="30" y="25" width="40" height="12" rx="2" ry="2" fill="#ffffff" />
  <!-- Controllerpoorten: twee cirkels -->
  <circle cx="40" cy="57" r="5" fill="#ffffff" />
  <circle cx="60" cy="57" r="5" fill="#ffffff" />
</svg>