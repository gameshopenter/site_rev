<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Hergebruik het verloop uit het logo zodat de categorie-afbeelding aansluit bij de huisstijl -->
    <linearGradient id="grad3DS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <!-- Bovenste helft van de 3DS -->
  <rect x="20" y="20" width="60" height="25" rx="3" ry="3" fill="url(#grad3DS)" />
  <!-- Onderste helft van de 3DS -->
  <rect x="20" y="55" width="60" height="25" rx="3" ry="3" fill="url(#grad3DS)" />
  <!-- Bovenste scherm -->
  <rect x="25" y="25" width="50" height="15" rx="2" ry="2" fill="#ffffff" />
  <!-- Onderste scherm -->
  <rect x="25" y="60" width="50" height="15" rx="2" ry="2" fill="#ffffff" />
</svg>